# Edge function config.
#
# GENERATED 2026-08-20 FROM LIVE PRODUCTION, and it is a latent-production-break fix.
#
# This repo had NO config.toml while production ran 41 of 41 functions at
# verify_jwt = false. `supabase functions deploy` applies config.toml and defaults anything
# undeclared to TRUE, so the next bulk deploy by anyone would have flipped all 41 to
# true at once: every webhook, the auth-email hook, the Google OAuth callback and every
# public endpoint would start returning 401. That is the whole product.
#
# Same defect was found and fixed the same day in Distribution-OS. Root pattern: these repos
# do not deploy edge functions in CI, so live state drifted away from the repo with nothing
# to notice.
#
# Values below are read verbatim from the Management API on 2026-08-20 (prod
# mkdeftmubrkseyrrbzvp). If you change one, change production too. A config.toml that
# disagrees with live is worse than none, because it looks authoritative.

