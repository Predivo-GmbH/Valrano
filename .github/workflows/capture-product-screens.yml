name: Capture product screens for predivo.ch

# Roger, 2026-09-24 (option A): Valrano's page on predivo.ch shows Valrano's REAL screens. They exist
# only behind sign-in, so they are captured here, inside GitHub, on the TEST copy (staging) as the test
# user the staging checks already use: the password never leaves GitHub and no customer's data can
# reach the public site. Runs only on a push to its own branch - never on main, so it cannot deploy.
# Keeps ONLY the screenshots: no trace, no test report (a Playwright trace records what is typed).

on:
  push:
    branches: [capture/product-screens]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      STAGING_URL: https://staging.valrano.com
      STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Take the test user's address from the staging checks (masked, never printed)
        run: |
          for k in STAGING_TEST_EMAIL STAGING_HTTP_USER; do
            v=$(grep -oE "^\s*$k:\s*\S+" .github/workflows/staging-gates.yml | head -1 | sed -E "s/^\s*$k:\s*//; s/^['\"]//; s/['\"]$//")
            if [ -n "$v" ] && [ "${v#\$\{\{}" = "$v" ]; then echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; echo "$k: taken"; else echo "$k: not set there"; fi
          done
      - name: Sign in as the staging test user (the staging checks' own setup)
        run: npx playwright test --config playwright.staging.config.ts --project=staging-auth-setup --trace=off
      - name: Fetch three public 2025 annual reports (Geberit, Sika, Belimo)
        run: |
          mkdir -p pdfs
          curl -sfL -A "Mozilla/5.0" -o pdfs/geberit-2025.pdf "https://www.geberit.com/assets/downloads/publications/2026/annual_report_2025_en.pdf"
          curl -sfL -A "Mozilla/5.0" -o pdfs/sika-2025.pdf "https://www.sika.com/dms/getdocument.get/25912ef3-3470-49d7-b658-f41ccfb7a317/glo-ar-25-annual-report.pdf"
          curl -sfL -A "Mozilla/5.0" -o pdfs/belimo-2025.pdf "https://report.belimo.com/ar25/app/uploads/Annual-Report-2025.pdf"
          ls -l pdfs
      - name: Give the test user real content through Valrano's own screens (cost-guarded)
        run: node scripts/fill-staging-demo.mjs
      - name: Diagnose the test copy (bucket names and the functions' last error messages only)
        if: always()
        env:
          SB_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SB_SERVICE: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          SB_MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "storage buckets:"; curl -s "$SB_URL/storage/v1/bucket" -H "Authorization: Bearer $SB_SERVICE" -H "apikey: $SB_SERVICE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(Array.isArray(j)?j.map(b=>b.name).join(', '):('answer: '+(j.message||j.error||'?')))}catch{console.log('unreadable answer')}})"
          START=$(date -u -d '-90 min' +%Y-%m-%dT%H:%M:%SZ); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SQL="select timestamp, event_message from function_logs order by timestamp desc limit 200"
          curl -s -G "https://api.supabase.com/v1/projects/vfwpcgdkrwqhdivfzmrg/analytics/endpoints/logs.all" --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" -H "Authorization: Bearer $SB_MGMT" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(j.result||[]).map(x=>String(x.event_message||'').replace(/\s+/g,' ').slice(0,300)).filter(m=>/error|fail|upload|bucket|storage|denied|violat/i.test(m));console.log(r.length?r.slice(0,25).join('\n'):('no matching log lines; answer keys: '+Object.keys(j).join(',')+(j.error?(' error: '+JSON.stringify(j.error).slice(0,200)):'')))}catch{console.log('unreadable answer')}})"
      - name: Capture the screens
        if: always()
        run: node scripts/capture-product-screens.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valrano-screens
          path: |
            screens/
            fill-debug/
          retention-days: 7
