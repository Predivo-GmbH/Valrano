name: Deploy to Production

# ─────────────────────────────────────────────────────────────────────────────
# TIERED PIPELINE (2026-07-15) — "gates guard prod, not every staging push".
#
# The old shape ran the FULL gauntlet (validate + integration -> deploy-staging ->
# E2E) on EVERY push to main, so a one-line content change took ~15 min. Industry
# standard (DORA): deploy often, keep the per-push pipeline fast, and run the heavy
# acceptance suite as a RELEASE gate + nightly — not on every push.
#
#   push -> main        FAST staging deploy: lint + unit + build + edge fns +
#                       FTP + alive-smoke. Roger sees changes on staging fast,
#                       many times a day.  (job: deploy-staging)
#   schedule (nightly)  FULL gauntlet against live staging — daily regression
#                       signal even with no promotion.  (jobs: gate-*)
#   workflow_dispatch   PROD promotion. Runs the FULL gauntlet (integration +
#     confirm=deploy    E2E) THEN deploys prod. The un-skippable gates live HERE
#                       now.  (jobs: gate-* -> deploy)
#
# Nothing was weakened for PRODUCTION: prod still cannot ship unless the staging
# integration suite and the staging E2E suite are both green for the promoted
# commit. What changed is WHEN they run — release-time + nightly instead of on
# every trivial staging push.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      # '*.md' matches ROOT-LEVEL markdown only in GitHub Actions, so a docs-only change
      # in any subfolder still triggered a full deploy. No markdown in this repo is a
      # build input (checked for `import ... .md`, `?raw` and import.meta.glob), so it
      # is safe to ignore markdown at any depth.
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # NIGHTLY, AND IT IS NOT A REPEAT OF THE PUSH RUN. Removed 2026-09-12 on the stated ground
  # that push already covers it; measured 2026-09-13, push SKIPS gate-integration, gate-security
  # and gate-e2e (ChannelMover run 34719595752), so this cron is the only daily run of them. The
  # 2026-09-09 security advisory that blocked five products was caught by exactly this run.
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm PRODUCTION deploy'
        required: true
        default: ''

# ===========================================================================
# A PUSH MUST NOT CANCEL THE RECEIPT A RELEASE NEEDS (2026-09-14).
#
# `deploy` refuses to promote a commit unless a green PUSH staging run exists for THAT EXACT SHA
# (the "Verify staging gate" step below). Until today this block cancelled the in-flight push run
# the moment the next commit landed on main. A staging run takes 10-37 minutes on our one
# self-hosted laptop; commits land faster than that, so the window closes before any run can finish,
# no commit ever earns the receipt, and THE REPOSITORY BECOMES UNPROMOTABLE - with no test failing
# and nothing red to point at.
#
# MEASURED ON CHANNELMOVER, which is simply the busiest repo and hit it first (deploy.yml on main):
#   8de7ee9  13:00:34Z  push      SUCCESS    <- the last green staging run
#   2a0ceff  13:31:34Z  push      cancelled
#   2a0ceff  13:41:05Z  dispatch  cancelled  <- a promotion attempt
#   b15fd51  14:08:11Z  push      cancelled
#   4d962e5  14:18:38Z  push      cancelled
# Four commits in 49 minutes. It does not self-heal and it gets WORSE the more work we do.
# THIS REPOSITORY CARRIES THE IDENTICAL SHAPE - the same gate step and the same expression - so it
# deadlocks the same way as soon as commits land faster than a staging run finishes.
#
# WHY `false` DOES NOT PILE UP RUNS. GitHub keeps at most ONE run PENDING per concurrency group: a
# third push supersedes the waiting one, it does not join a line. The running one always finishes
# and the newest always gets the next slot.
#
# AND IT IS WHAT THE FLEET ALREADY LEARNED. Cockpit's deploy.yml carries the same note after a
# cancelled mid-flight mirror "leaves staging half-uploaded and loses its E2E verdict".
# deploy-staging FTP-mirrors the staging site with the same lftp step and the same shared host as
# production; "staging" is not a synonym for "goes somewhere else" (2026-09-09).
#
# INVARIANT, from ClaudeShared/hooks/fleet-deploy-queue: NO PATH THAT USED TO DENY MAY NOW ALLOW.
# This changes only whether a run is allowed to FINISH. Not one line of the promotion gate moves.
# ===========================================================================
concurrency:
  # Production promotions (workflow_dispatch) keep their own serialized, NEVER-cancelled
  # group: cancelling a mid-flight FTP mirror can leave prod half-uploaded.
  # Pushes (the staging pipeline) get a per-ref group that DOES cancel — when several
  # commits land in a row only the newest needs a staging deploy + E2E.
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-production' || format('staging-{0}', github.ref) }}
  cancel-in-progress: false

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

# ===========================================================================
# NPM CACHE / self-hosted runner — deliberately absent.
# Do not add `cache: npm` back to setup-node, and do not remove the
# `runner.environment != 'self-hosted'` guards on the actions/cache steps.
#
# These jobs run on a PERSISTENT self-hosted runner (vars.RUNNER_LABEL =
# predivo-wsl). There, ~/.npm and ~/.cache/ms-playwright are not throwaway
# caches a job populates and discards: they are directories holding everything
# this machine has ever installed, for every repo on it. The cache-save runs as
# a POST-STEP INSIDE the job's own timeout-minutes budget, so when it is slow it
# does not merely waste time — it KILLS the job.
#
# And it misses precisely when it matters: the cache key is derived from
# package-lock.json, so the save fires on exactly the dependency-changing
# commits a security gate exists to inspect. Every other commit gets a cache hit
# and sails through, which is why this stayed invisible for so long.
#
# GitHub records a timeout as `cancelled`, NOT `failed`. Every real step inside
# the job shows green, the run page looks clean, and downstream jobs with
# `needs:` are silently SKIPPED — so a production promotion can be lost without
# anything showing red. Verify the deploy JOB, never the run colour.
#
# Measured, not inferred (2026-09-02/03):
#   BoatBuddy   run 33718969126 gate-integration: npm ci 18s, tests 3s, then
#               Post Run actions/setup-node cancelled after 9m34s at
#               "Sent 1006632960 of 1811836788 (55.6%)" — a 1.81 GB upload.
#   launchready run 33664843636 gate-security cancelled -> deploy SKIPPED.
#   arivioo     runs 33659826937 / 33662539216 gate-security cancelled (~9m35s).
#   predivo     run 33792521636 critical-path killed by the PLAYWRIGHT cache
#               save (544s) — the same fault, a different cache.
#   signalscore run 33729943705 gates: Playwright cache save cancelled at 779s.
#
# The fix is to REMOVE the work that does not belong inside the budget, never to
# widen the timeout — a wider timeout hides this instead of fixing it. npm ci
# already reads the host's ~/.npm directly, so the cache bought nothing here.
# The guards keep the caches working on GitHub-hosted runners, where they are a
# genuine win and the machine is thrown away afterwards.
# ===========================================================================

jobs:
  # ===========================================================================
  # EDGE-FUNCTION TYPE CHECK - the only thing in this repo that compiles
  # supabase/functions.
  #
  # eslint ignores the directory, the app tsconfigs exclude it, vitest never loads
  # it, and `npm run build` runs tsc over src/ only - so before this job existed a
  # type error in an edge function reached a running environment with nothing
  # having looked at it. That is exactly how ReplyFlow shipped a broken function in
  # August 2026 (R-CI-02, "a gate born disabled is not a gate").
  #
  # It carries NO `if:`, so it runs on every push, every nightly and every
  # production promotion, and BOTH deploying jobs `needs:` it: a NEW type error
  # stops the staging edge-function deploy and stops the prod promotion.
  # `deno check` follows imports, so _shared is covered through its callers, but
  # every .ts file is passed explicitly as well - a shared module with no caller
  # yet would otherwise be checked by nobody.
  #
  # RATCHET, not plain pass/fail - the same shape as replyflow. The first run over
  # these 49 files found 53 pre-existing errors (mostly untyped Supabase query
  # results cast with `as`, plus PromiseSettledResult narrowing). A plain fail
  # would be permanently red, which in this repo means permanently blocking, and a
  # gate that has to be switched off is not a gate. So it PASSES while the count
  # stays at or under .github/typecheck-functions-baseline.txt and FAILS the moment
  # a new error pushes it UP. Every time the count drops, the baseline is lowered
  # in the same commit so the debt cannot grow back.
  #
  # One Deno, no npm install, ~1 min on the self-hosted runner.
  # ===========================================================================
  gate-edge-typecheck:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check supabase/functions (ratchet - must not get worse)
        run: |
          set +e
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -not -path '*/node_modules/*' | sort)
          echo "Checking ${#FILES[@]} files"
          OUT=$(deno check --config .github/deno.check.json "${FILES[@]}" 2>&1)
          RC=$?
          set -e
          echo "$OUT"

          BASE=$(tr -dc '0-9' < .github/typecheck-functions-baseline.txt)
          if [ "$RC" -eq 0 ]; then
            COUNT=0
          else
            COUNT=$(echo "$OUT" | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+' | tail -1)
          fi

          # A run that fails for a reason we cannot count (network, deno crash, bad
          # flag) must NOT be read as "0 errors, all good". Fail loudly instead.
          if [ -z "$COUNT" ]; then
            echo "::error::deno check failed (exit $RC) without reporting an error count - cannot compare against the baseline. Treating as a failure rather than a pass."
            exit 1
          fi

          echo "type errors: $COUNT   baseline: $BASE"
          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::supabase/functions type errors went UP: $BASE -> $COUNT. Fix the new error; do not raise the baseline."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::warning::type errors DROPPED $BASE -> $COUNT. Lower .github/typecheck-functions-baseline.txt to $COUNT in this commit so the debt cannot grow back."
          fi
          echo "OK - no new type errors."

  # ===========================================================================
  # FAST STAGING DEPLOY — every push. One job, one runner, one npm ci, build once.
  # lint + unit tests are the per-push gates (the test pyramid's fast base): a
  # change that lints, typechecks (tsc in build), and passes unit tests cannot
  # white-screen the site. Heavy integration / E2E suites run on the nightly +
  # prod-promotion gauntlet below, NOT here.
  # ===========================================================================
  deploy-staging:
    # ---------------------------------------------------------------------------
    # SINGLE WRITER FOR THE ONE STAGING SITE (added 2026-09-09, board row
    # a-production-release-test-can-be-failed-by-an-unrelated).
    #
    # The workflow-level `concurrency:` above deliberately puts pushes and promotions in
    # DIFFERENT groups, and each half of that is right on its own: a mid-flight FTP mirror to
    # PRODUCTION must never be cancelled, and a burst of pushes only needs the newest staged.
    # Together they mean a promotion and a push can run AT THE SAME TIME on the same ref - and
    # then `deploy-staging` is FTP-mirroring new files over the staging site while the release
    # gates are driving a browser against exactly that site. A release test then fails on a
    # half-uploaded site with nothing wrong with the release at all. Measured on ReplyFlow
    # 2026-09-02: dispatch 33627614494 (12:00:54Z) overlapped push 33627544651 (12:00:13Z) on
    # the same commit; the health check passed against the OLD staging still up, then a page
    # navigation timed out on all three attempts inside the FTP replacement window. The same
    # gate had passed twice that day with no deploy in flight.
    #
    # This is a JOB-level group, not a change to the workflow-level one, and that is the point:
    # it serialises only the jobs that touch the staging site, so pushes still cancel each other
    # and promotions still refuse to be cancelled. cancel-in-progress MUST stay false -
    # cancelling either half is the failure this exists to prevent, not the remedy.
    #
    # Proven on ReplyFlow first; this is the same change on the rest of the fleet, which the
    # 2026-09-02 finding named explicitly as sharing the shape.
    # ---------------------------------------------------------------------------
    concurrency:
      group: staging-site-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'push'
    # A push must not put an edge function on staging that does not compile.
    needs: [gate-edge-typecheck]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          # Sentry (error monitoring pilot): DSN inlined into the bundle; auth token
          # (+ org/project) enables source-map upload. environment is tagged by hostname
          # at runtime, so this same DSN produces "staging"-tagged events here.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # PUBLIC Cloudflare Turnstile site key. Without this line the bundle ships with NO
          # captcha widget at all — see the assertion below, which is what makes that impossible
          # to miss.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Assert the Turnstile site key actually landed in the bundle (blocking)
        # A CAPTCHA THE CLIENT CANNOT ANSWER IS A WORSE OUTAGE THAN THE HOLE IT CLOSES.
        # `vite build` inlines VITE_* at BUILD time, and src/components/TurnstileWidget.tsx
        # deliberately renders NOTHING when VITE_TURNSTILE_SITE_KEY is unset. So an empty, missing
        # or wrong secret produces a widget-less bundle that looks completely healthy: every
        # runtime monitor stays green, and it becomes a TOTAL customer lockout — login, signup and
        # password reset all refused — the instant security_captcha_enabled is switched on
        # project-wide. ReplyFlow hit exactly this shape ("dead sitekey, green monitors").
        # `gh secret list` proves only that a NAME exists; this step is what proves the VALUE.
        # The site key is PUBLIC (it ships in every visitor's browser), so it is pinned literally
        # here and compared — a secret that is merely non-empty is not good enough.
        run: |
          set -euo pipefail
          expected='0x4AAAAAAEz4tSh-Lly_5idd'
          if ! grep -rq "$expected" ./dist/; then
            echo "::error::The Turnstile site key ($expected) is NOT in the staging bundle."
            echo "  vite build inlines VITE_* at build time; the repository secret"
            echo "  VITE_TURNSTILE_SITE_KEY is empty, wrong, or was not passed to the build step."
            echo "  Shipping this renders no captcha widget at all. Nothing was deployed."
            exit 1
          fi
          echo "ok - Turnstile site key is present in the staging bundle ($(grep -rl "$expected" ./dist/ | wc -l) file(s))."

      - name: Install Supabase CLI
        run: npm install -g supabase@2.109.1

      # Ship the database before anything else (2026-08-21, fleet drift fix):
      # applies every supabase/migrations file not yet in the ledger, fails the
      # deploy on error. No-op when already reconciled.
      - name: Apply database migrations to staging
        run: node scripts/apply-migrations.mjs --project-ref vfwpcgdkrwqhdivfzmrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Ship staging edge functions on every push so staging stays a faithful
      # mirror of the code (the nightly + promotion gauntlets test against it).
      - name: Deploy edge functions to staging
        run: |
          n=0
          until [ $n -ge 4 ]; do
            if supabase functions deploy --project-ref vfwpcgdkrwqhdivfzmrg --no-verify-jwt --use-api; then
              echo "Edge functions deployed to staging (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Supabase functions-deploy attempt $n failed (transient API error, e.g. 502); backing off 60s..."; sleep 60
          done
          echo "::error::Edge functions deploy to staging failed after 4 attempts"; exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Smoke-test staging
        run: |
          echo "=== Staging GraphQL ping ==="
          gql_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_STAGING_URL }}/graphql/v1" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}')
          echo "GraphQL response: $gql_response"
          if [ "$gql_response" != "200" ]; then
            echo "::error::Staging smoke test FAILED (GraphQL returned $gql_response)"
            exit 1
          fi
          echo "Staging DB is alive"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "valrano-staging" > dist/.site-id

      - name: Prepare staging .htaccess
        run: |
          # Use the REAL production .htaccess (from build) so staging catches Apache errors
          mv dist/.htaccess /tmp/prod.htaccess
          {
            echo 'AuthType Basic'
            echo 'AuthName "Staging"'
            echo 'AuthUserFile /var/www/vhosts/valrano.com/staging.valrano.com/.htpasswd'
            echo 'Require valid-user'
            echo ''
            cat /tmp/prod.htaccess
            echo ''
            echo '# --- Staging overrides ---'
            echo '<IfModule mod_headers.c>'
            echo '  Header always set X-Robots-Tag "noindex, nofollow"'
            echo '  <FilesMatch "\.(js|css|woff2|png|jpg|webp|avif|svg|ico)$">'
            echo '    Header set Cache-Control "no-cache"'
            echo '  </FilesMatch>'
            echo '  <FilesMatch "\.html$">'
            echo '    Header set Cache-Control "no-cache, no-store, must-revalidate"'
            echo '  </FilesMatch>'
            echo '</IfModule>'
          } > dist/.htaccess

      - name: Verify deploy target (site-id guard)
        run: |
          # set +e: without it, bash -e aborts OUT=$(lftp…) on any non-zero exit BEFORE the
          # RC handling below runs — defeating the "connection-error vs first-deploy" logic
          # (a transient guard blip would abort blindly instead of retrying/allowing). §3f.
          set +e
          GUARD="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes;"
          OUT=$(timeout 90 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "$GUARD cat staging.valrano.com/.site-id; quit" 2>&1)
          RC=$?
          REMOTE_ID=$(echo "$OUT" | tr -d '[:space:]')
          if [ $RC -ne 0 ]; then
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            if echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)|timed? ?out|connection refused|couldn.t connect'; then
              echo "::error::Site-id guard INCONCLUSIVE — FTP connection/auth failure, refusing to deploy blind. Output: $OUT"
              exit 1
            fi
            # Non-zero rc but not a connection/auth error — treat as file genuinely absent (first deploy). Allow through.
            REMOTE_ID=""
          fi
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "valrano-staging" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'valrano-staging'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload to staging
        # Zero-downtime, matching this repo's own production job. A single
        # `mirror --delete` uploads and deletes in ONE pass, so mid-mirror the new
        # index.html can be live while its hashed chunks are not yet uploaded and the old
        # ones are already gone: every chunk 404s and the page renders BLANK. Proven
        # 2026-08-23 in ReplyFlow run 32662317038 (index.html 200, five chunks 404, blank
        # screenshot) where it failed an E2E gate and read as a flaky test. Assets first
        # without --delete, so new chunks exist before anything references them.
        #
        # The root mirror keeps --delete but EXCLUDES assets/: a browser tab still
        # running an OLD index.html fetches the OLD hashed chunks (lazily, on the next
        # navigation), and deleting them at deploy time turns that into "Failed to fetch
        # dynamically imported module" (Sentry valrano 2026-08-29, 2 events). Old chunks
        # are pruned by AGE (14 days) in the step below — long after every open tab has
        # either reloaded or gone away.
        run: |
          set +e
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set net:timeout 60; set net:max-retries 8; set net:persist-retries 8; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1.2; set ftp:fix-pasv-address yes; set ftp:prefer-epsv no; set ftp:passive-mode yes; set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ staging.valrano.com/assets/
          mirror --reverse --verbose --no-perms --delete \
            --exclude '^assets/' \
            --exclude .htpasswd --exclude cgi-bin/ \
            ./dist/ staging.valrano.com/
          bye
          SCRIPT
          )
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 - not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::Upload to staging failed after 4 attempts"; exit 1; }
            echo "::warning::Upload to staging attempt $n failed - retrying in 25s..."
            sleep 25
          done
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the asset-retention exclusion above
        # leaves behind. lftp has no find -mtime (only -max-depth/-ls — verified against
        # the 4.8.1 man page), so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659, supported by the ProFTPD on this host) and deletes files older than
        # 14 days. 14 days ≫ any realistically open tab, so stale-tab chunk fetches 404
        # only for sessions older than the retention window (the client-side
        # reloadOnceForChunk in crash-report.ts still covers that tail).
        #
        # Never fails the deploy: a cleanup hiccup must not block promotion-relevant
        # runs; it logs ::error:: (red annotation, run still green) and the next deploy
        # retries. Capped at 1000 deletions per run so a logic bug cannot mass-delete
        # and a long outage self-heals progressively over successive deploys.
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: staging.valrano.com/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively —
            # nested chunk dirs like _next/static/chunks are covered too); normalize to a
            # path relative to ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          # Retry loop survives transient curl failures (exit 23 etc.), not just non-200s.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "staging:${{ secrets.STAGING_HTTP_PASS }}" https://staging.valrano.com --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Staging health check passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Staging check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging returned HTTP $STATUS after 6 attempts - likely .htaccess error."
          exit 1

  # ===========================================================================
  # FULL GAUNTLET — runs on the nightly schedule AND on prod promotion, NOT on push.
  # These jobs are the un-skippable PRODUCTION gates: the prod `deploy` job `needs`
  # both, so prod cannot ship unless every one is green. They test against the LIVE
  # staging site/DB (which the push above already deployed).
  # ===========================================================================
  gate-integration:
    # ---------------------------------------------------------------------------
    # SINGLE WRITER FOR THE ONE STAGING SITE (added 2026-09-09, board row
    # a-production-release-test-can-be-failed-by-an-unrelated).
    #
    # The workflow-level `concurrency:` above deliberately puts pushes and promotions in
    # DIFFERENT groups, and each half of that is right on its own: a mid-flight FTP mirror to
    # PRODUCTION must never be cancelled, and a burst of pushes only needs the newest staged.
    # Together they mean a promotion and a push can run AT THE SAME TIME on the same ref - and
    # then `deploy-staging` is FTP-mirroring new files over the staging site while the release
    # gates are driving a browser against exactly that site. A release test then fails on a
    # half-uploaded site with nothing wrong with the release at all. Measured on ReplyFlow
    # 2026-09-02: dispatch 33627614494 (12:00:54Z) overlapped push 33627544651 (12:00:13Z) on
    # the same commit; the health check passed against the OLD staging still up, then a page
    # navigation timed out on all three attempts inside the FTP replacement window. The same
    # gate had passed twice that day with no deploy in flight.
    #
    # This is a JOB-level group, not a change to the workflow-level one, and that is the point:
    # it serialises only the jobs that touch the staging site, so pushes still cancel each other
    # and promotions still refuse to be cancelled. cancel-in-progress MUST stay false -
    # cancelling either half is the failure this exists to prevent, not the remedy.
    #
    # Proven on ReplyFlow first; this is the same change on the rest of the fleet, which the
    # 2026-09-02 finding named explicitly as sharing the shape.
    # ---------------------------------------------------------------------------
    # ---------------------------------------------------------------------------
    # NO staging-site LOCK ON THIS JOB, and that is a correction, not an omission (2026-09-14).
    #
    # It used to carry `concurrency: group: staging-site-${{ github.ref }}` alongside
    # `deploy-staging` and `gate-e2e`. That lock exists for ONE measured reason, from 2026-09-02:
    # while `deploy-staging` is FTP-mirroring new files over the staging WEBSITE, a gate DRIVING A
    # BROWSER against that website fails on a half-uploaded page with nothing wrong with the release
    # (ReplyFlow dispatch 33627614494 overlapping push 33627544651). `gate-e2e` still carries it.
    #
    # THIS JOB NEVER TOUCHES THE WEBSITE. It runs the integration suite against the staging SUPABASE
    # project - no browser, no page, no website URL anywhere in it. So it was serialised against a
    # writer it does not contend with.
    #
    # WHAT THAT COST. GitHub allows exactly ONE job PENDING per concurrency group;
    # `cancel-in-progress: false` protects a RUNNING job, never the queue. With `deploy-staging`
    # holding the group and BOTH gates queued behind it, the older pending one was CANCELLED
    # OUTRIGHT. Measured on ChannelMover, run 34850759426: gate-integration `cancelled` at
    # 13:41:07Z with ZERO steps, two seconds after the run started, while gate-e2e stayed pending.
    # A cancelled gate is not a failing gate - `deploy` is SKIPPED rather than blocked, so the run
    # looks green and ships nothing.
    #
    # NO PATH THAT USED TO DENY MAY NOW ALLOW: dropping a lock cannot turn a refusal into an
    # approval. The only change is that this suite now runs instead of being erased, which can only
    # ever ADD a red. `deploy` still needs it green.
    #
    # If this job is ever given a step that loads a page from the staging WEBSITE, put the lock back
    # in the same commit - and then gate-e2e and this one must be merged into ONE job, or they will
    # start erasing each other again.
    # ---------------------------------------------------------------------------
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Integration tests against staging
        run: npm run test:integration
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}

  gate-e2e:
    # ---------------------------------------------------------------------------
    # SINGLE WRITER FOR THE ONE STAGING SITE (added 2026-09-09, board row
    # a-production-release-test-can-be-failed-by-an-unrelated).
    #
    # The workflow-level `concurrency:` above deliberately puts pushes and promotions in
    # DIFFERENT groups, and each half of that is right on its own: a mid-flight FTP mirror to
    # PRODUCTION must never be cancelled, and a burst of pushes only needs the newest staged.
    # Together they mean a promotion and a push can run AT THE SAME TIME on the same ref - and
    # then `deploy-staging` is FTP-mirroring new files over the staging site while the release
    # gates are driving a browser against exactly that site. A release test then fails on a
    # half-uploaded site with nothing wrong with the release at all. Measured on ReplyFlow
    # 2026-09-02: dispatch 33627614494 (12:00:54Z) overlapped push 33627544651 (12:00:13Z) on
    # the same commit; the health check passed against the OLD staging still up, then a page
    # navigation timed out on all three attempts inside the FTP replacement window. The same
    # gate had passed twice that day with no deploy in flight.
    #
    # This is a JOB-level group, not a change to the workflow-level one, and that is the point:
    # it serialises only the jobs that touch the staging site, so pushes still cancel each other
    # and promotions still refuse to be cancelled. cancel-in-progress MUST stay false -
    # cancelling either half is the failure this exists to prevent, not the remedy.
    #
    # Proven on ReplyFlow first; this is the same change on the rest of the fleet, which the
    # 2026-09-02 finding named explicitly as sharing the shape.
    # ---------------------------------------------------------------------------
    concurrency:
      group: staging-site-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      # `npx playwright install chromium` refuses to run on a Linux distro newer than the one
      # Playwright knows about: on 2026-08-25 one of the self-hosted runners came up on Ubuntu
      # 26.04 and every attempt died with "Playwright does not support chromium on
      # ubuntu26.04-x64". Playwright 1.60 is already the newest release, so there is no version
      # to upgrade to - this is Playwright's own documented escape hatch for a distro that ships
      # ahead of it. It has to be set on the JOB, not just the install step: the browser is
      # stored under a path keyed by host platform, so the test run has to resolve the same key
      # or it will not find what the install step downloaded.
      # The value carries the architecture suffix, exactly as the failure prints it
      # ("ubuntu26.04-x64"): a bare "ubuntu24.04" is not a host-platform string and is rejected
      # the same way. Harmless where the host is already supported - 24.04-x64 is what it
      # already resolves to.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          # Retry loop survives transient curl failures (exit 23 etc.), not just non-200s.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "staging:${{ secrets.STAGING_HTTP_PASS }}" https://staging.valrano.com --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Staging health check passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Staging check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging returned HTTP $STATUS after 6 attempts - likely .htaccess error. Blocking production deploy."
          exit 1

      - name: Run E2E tests against staging
        run: npm run test:e2e:staging
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-staging-report
          path: playwright-report/
          retention-days: 7

  # ===========================================================================
  # PRODUCTION PROMOTION — manual dispatch (confirm=deploy) only. Gated behind the
  # full gauntlet above (needs: gate-integration + gate-e2e) AND a recorded green
  # staging deploy for this exact commit. This is where the un-skippable gates live.
  # ===========================================================================
  # ===========================================================================
  # SECURITY GATE (G3, deploy-standard §4d) — blocks prod promotion. gitleaks
  # full-history secret scan + `npm audit --audit-level=high`. AI
  # security-review stays advisory. Fleet retrofit 2026-08-15 (clean at high).
  # NOTE: coverage gate is NOT yet blocking here — the feature-coverage check
  # currently FAILS (10 features, real gap); flip to blocking after that is fixed.
  # ===========================================================================
  gate-security:
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact -v --exit-code 1
      - name: 'Secret scan: full history (AUDIT only, non-blocking - historical secrets rotated-dead 2026-07-07, deliberate no-scrub)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 0 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dependency audit (blocking at high)
        # --omit=dev: PRODUCTION dependencies only. A dev-only advisory (build tooling, scaffolding
        # CLIs) never reaches a customer, so it must not block a release (Roger 2026-09-03). Dev/
        # build-time deps are covered by the scheduled fleet audit, which files a work item instead of
        # blocking. Both directions proven: production-monitor/test/audit-scope-both-directions.test.mjs
        run: npm audit --omit=dev --audit-level=high

      # ─────────────────────────────────────────────────────────────────────────────────────
      # OPEN-RELAY GUARD — asks the LIVE endpoints, because the bug lived where no file could
      # see it (signal-fleet:send-auth-email:unauthenticated-relay, closed on Valrano
      # production 2026-09-04).
      #
      # send-auth-email verified a Standard-Webhooks signature ONLY when one was present, and
      # this project's Send-Email hook is an UNSIGNED pg_net call — so "no signature" meant
      # "no check" and any holder of the public website key could make Valrano mail a login or
      # password-reset code to an address of their choosing. Measured on production the day it
      # was closed: a forged unsigned payload answered 200. It actually sent.
      #
      # THE CODE FIX WAS COMMITTED ON 2026-09-02 AND PRODUCTION WAS STILL OPEN TWO DAYS LATER,
      # because enforcement is inert until a secret exists in two places that appear in NO
      # file in this repo — a Vault row and an edge-function env var. Every source-reading
      # test was green throughout. That is precisely why this step is a network probe and not
      # a unit test, and why it lives in a job that runs NIGHTLY and on EVERY PROMOTION rather
      # than only when someone edits the function.
      #
      # Needs no credentials — being refused without one is the whole assertion. Blocking: a
      # promotion must not ship while the relay is open, and the nightly run is what catches a
      # `supabase db reset` or a re-provision silently dropping the Vault row (it is DATA, not
      # schema). Recovery is scripts/seed-email-relay-vault.mjs; read its header first, the
      # ORDER matters and getting it wrong rejects every auth email in between.
      # ─────────────────────────────────────────────────────────────────────────────────────
      - name: 'Open-relay guard: send-auth-email refuses unauthenticated callers (live probe)'
        run: node supabase/functions/send-auth-email/relay-auth.prod.test.mjs
      # SAST — code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      - name: SAST scan (semgrep)
        run: |
          # `python3 -m pip install semgrep` worked on GitHub's runners and stopped working the
          # day this repo moved to the self-hosted WSL Ubuntu runner: Debian's system Python is
          # PEP 668 "externally managed", so a bare pip install exits 1 with
          # "error: externally-managed-environment" and gate-security fails BEFORE semgrep runs -
          # reporting nothing about security while blocking every production promotion. That is
          # what happened on 2026-08-25 in run 32824178875.
          # A venv is not the fix here: python3-venv is absent on the runner (ensurepip does not
          # import) and the runner's sudo is deliberately too narrow to apt-install it.
          # --user keeps semgrep out of the system site-packages; --break-system-packages is what
          # PEP 668 requires in order to write anywhere at all. Both flags are harmless on
          # GitHub-hosted runners, so the fallback path still works if RUNNER_LABEL is cleared.
          python3 -m pip install --quiet --user --break-system-packages semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep --version
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  deploy:
    # Normal production deploy: manual run, typed "deploy" confirmation. Intentionally does
    # NOT `needs: [validate-staging, e2e-staging]` anymore — staging already ran on the push
    # being promoted; re-running it here re-exposed prod to transient staging/Supabase/FTP
    # failures. Instead the first step GATES on the recorded staging result for this exact
    # commit — safety kept, redundant re-execution removed.
    # PRODUCTION deploys only via manual dispatch (confirm=deploy) — a push to
    # main deploys STAGING only. Same pattern as ReplyFlow/BoatBuddy/SignalScore.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    needs: [gate-integration, gate-e2e, gate-security, gate-edge-typecheck]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - name: Verify staging gate (this commit passed staging + E2E on push)
        # curl + grep only. No `gh`, no `jq`. This repo's jobs run on our own machines, where
        # `gh` is not on the runner service's PATH: it was installed after the runner was
        # configured, so the service's cached PATH predates it, and passwordless sudo is
        # deliberately absent so the service cannot be restarted to pick it up. The gate died
        # with "gh: command not found" (exit 127), which meant NO production promotion could
        # pass at all - a gate cannot say yes if it cannot run. Same fix as BackOffice and
        # Cockpit (2026-08-25): a deploy gate must not depend on a tool that happens to be on
        # the host. curl is everywhere, and the REST API needs nothing but the token in scope.
        # The gate's MEANING is unchanged: a green staging run for this exact commit, or else
        # the docs/chore-only fallback against the last staged commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA="${{ github.sha }}"
          API="https://api.github.com/repos/$GH_REPO"
          # A failed request returns empty, never a false "yes": every check below is
          # fail-closed, so a network problem blocks the promotion instead of waving it through.
          # -f makes curl fail (empty output, non-zero) on any non-2xx, so a 406/403/429 error
          # BODY can never reach a grep/awk parser as if it were content. Combined with `|| true`
          # this keeps the "failed request returns empty" contract above literally true.
          api() { curl -fsS -m 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: $2" "$1" || true; }
          json() { api "$1" 'application/vnd.github+json'; }

          echo "Checking for a green staging run of commit $SHA ..."
          # head_sha= filters server-side, so a "success" anywhere in this payload can only
          # belong to THIS commit's own run. That is what makes reading it without jq safe -
          # nothing has to be paired up by position.
          OK=$(json "$API/actions/workflows/deploy.yml/runs?branch=main&event=push&head_sha=$SHA&per_page=50" \
                 | grep -c '"conclusion": *"success"' || true)
          if [ "${OK:-0}" -lt 1 ]; then
            echo "HEAD $SHA has no direct staging run; checking if only docs/chore changed since a recently staged commit ..."
            SAFE='^(docs/|.*\.md$|README|LICENSE|\.gitignore$|\.gitleaks\.toml$|\.gitleaksignore$)'
            # The refuse path USED TO download a full compare diff per base (application/vnd.github.diff,
            # each capped at the 30s curl timeout) for ~100 bases, so a genuine refusal could exceed the
            # 20-min job timeout and surface to the operator as "timed out" instead of its real reason.
            # Two changes make refusal cheap WITHOUT weakening the gate (verdict is unchanged):
            #   1. ONE JSON compare per base yields BOTH the top-level ahead/identical status AND the
            #      changed files (files[].filename / .previous_filename) - no separate full-diff download.
            #   2. A hard cap on bases walked: bases come newest-first, so the legitimate docs-only case
            #      (a docs commit pushed right after a staged app commit) resolves in the first iteration.
            #      If none of the most recent MAX_BASES staged commits match, we REFUSE explicitly
            #      (fail-closed) with a message that says so - never silently, never past the timeout.
            MAX_BASES=30
            PROMOTABLE=0
            # status=success returns ONLY green runs, so every head_sha here is by definition a commit
            # that passed staging - and newest-first, so the common case resolves immediately.
            BASES=$(json "$API/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=100" \
                      | grep -o '"head_sha": *"[0-9a-f]\{40\}"' | awk -F'"' '{print $4}')
            i=0
            for BASE in $BASES; do
              i=$((i+1))
              if [ "$i" -gt "$MAX_BASES" ]; then
                echo "::error::Commit $SHA has no staging run and still differs in app files from each of the $MAX_BASES most recently staged commits. Push to main, let staging go green, then promote."
                exit 1
              fi
              # ONE JSON compare gives the top-level status AND the file list. The first "status" in a
              # compare payload is the top-level one; the per-file "status" values live later inside
              # .files, so head -1 is the compare status. A failed request yields empty (curl -f), so a
              # 406/403/429 body can never be parsed as content.
              CMP=$(json "$API/compare/$BASE...$SHA")
              STATUS=$(printf '%s' "$CMP" | grep -o '"status": *"[a-z]*"' | head -1 | awk -F'"' '{print $4}')
              case "${STATUS:-}" in ahead|identical) ;; *) continue ;; esac
              # Real JSON keys are "filename":/"previous_filename": (clean quotes); the same strings
              # appearing INSIDE a patch body are backslash-escaped (\"filename\":) and do NOT match, so
              # diff content cannot spoof a path. Both sides of a rename are read, so a rename cannot
              # slip an app file past this on either name.
              FILES=$(printf '%s' "$CMP" \
                        | grep -oE '"(filename|previous_filename)": *"[^"]*"' | awk -F'"' '{print $4}' | sort -u)
              # Fail-CLOSED on a truncated/empty payload: an 'ahead' compare ALWAYS lists at least one
              # changed file, so no filenames means the request failed (an oversized-compare 406, a
              # rate-limit body, a timeout). Reading that as "nothing changed" would promote untested
              # code off a transient API blip, so skip this base. 'identical' is the one legitimately
              # empty compare, so it is exempt.
              case "$STATUS" in
                ahead) [ -z "$FILES" ] && continue ;;
              esac
              NONDOC=$(printf '%s' "$FILES" | grep -vE "$SAFE" || true)
              if [ -z "$NONDOC" ]; then echo "Only docs/chore changed since staged commit $BASE (status=$STATUS); app tree matches a staged state. Promoting."; PROMOTABLE=1; break; fi
            done
            if [ "$PROMOTABLE" -ne 1 ]; then
              echo "::error::Commit $SHA has no staging run and changes app files since the last staged commit. Push to main, let staging go green, then promote."
              exit 1
            fi
          fi
          echo "Staging gate passed - commit $SHA has a green staging run. Promoting to production."

      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 is REQUIRED by the functionality gate below. A prod promotion is a
          # workflow_dispatch off main, so the checkout IS main and origin/main == HEAD — the gate's
          # defaultRange skips that empty base and diffs HEAD~1...HEAD (the tip commit's own change).
          # A default depth-1 checkout has no HEAD~1, so that diff would fail and the gate would
          # exit 1 on EVERY promotion. Full history makes the fallback (and any FUNCTIONALITY_GATE_BASE)
          # resolvable. gate-security already fetches full history for the same class of reason.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      # Resolve the base the functionality gate diffs against: the commit CURRENTLY LIVE IN
      # PRODUCTION — the head_sha of the last successful prod promotion (a workflow_dispatch run of
      # this workflow that concluded success; a `push` run is a staging deploy, not a promotion).
      # base...HEAD then covers EVERY commit shipping in this promotion, not just the tip.
      #
      # WHY THIS STEP EXISTS: with FUNCTIONALITY_GATE_BASE unset, the script's defaultRange sees
      # origin/main == HEAD on a workflow_dispatch off main, skips that empty base, and falls back to
      # HEAD~1...HEAD (the tip commit only). A promotion after N pushes then checked commit N and
      # shipped 1..N-1 unchecked. See docs/RECORD-functionality-gate-tip-commit-only-on-promotion-2026-09-19.md
      #
      # FAIL-CLOSED: if the base cannot be resolved (no prior successful prod promotion yet, or the
      # GitHub API request failed) we exit 1 rather than let the gate silently fall back to the
      # tip-only range. A gate that cannot establish what is already live cannot certify what is new.
      - name: Resolve functionality-gate base (last production promotion)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          API="https://api.github.com/repos/$GH_REPO"
          # Same fail-closed curl helper as the staging-gate step above: -f makes a non-2xx yield
          # empty output (never a error-body parsed as content); `|| true` keeps "failed request =>
          # empty" literally true so the emptiness check below fires instead of aborting the step.
          api() { curl -fsS -m 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: $2" "$1" || true; }
          json() { api "$1" 'application/vnd.github+json'; }
          # status=success returns ONLY green runs, newest-first; event=workflow_dispatch selects PROD
          # promotions. The current in-flight run is not "success" yet, so it never appears here — the
          # first head_sha is therefore the commit last promoted to production.
          BASE=$(json "$API/actions/workflows/deploy.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" \
                   | grep -o '"head_sha": *"[0-9a-f]\{40\}"' | head -1 | awk -F'"' '{print $4}')
          if [ -z "$BASE" ]; then
            echo "::error::Could not resolve the last successful production promotion (no prior green workflow_dispatch run of deploy.yml, or the GitHub API request failed). The functionality gate cannot establish what is already live, so this promotion is blocked (fail-closed). Retry once a prior production deploy exists and the API is reachable."
            exit 1
          fi
          # fetch-depth: 0 was fetched above, but a base older than the fetched history would make the
          # diff fail — and defaultRange would then silently drop back to HEAD~1...HEAD. Verify the
          # base commit is present and fail-closed if not, so the tip-only fallback can never happen.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::The last production commit $BASE is not present in the checkout history, so the functionality-gate range cannot be computed. Blocking (fail-closed)."
            exit 1
          fi
          echo "Functionality-gate base = $BASE (commit last promoted to production)."
          echo "FUNCTIONALITY_GATE_BASE=$BASE" >> "$GITHUB_ENV"

      # Nothing new ships untested (installed 2026-09-17). BLOCKING - never continue-on-error.
      # What counts as a functionality: docs/WHAT-COUNTS-AS-A-FUNCTIONALITY.md
      # The gate diffs FUNCTIONALITY_GATE_BASE...HEAD — the base is the last production commit,
      # resolved and exported by the step above (which fails closed if it cannot be resolved). This
      # replaces the old HEAD~1...HEAD tip-only range that shipped intermediate commits unchecked.
      - name: Nothing new shipped without its test (BLOCKING)
        run: node scripts/check-new-functionality-registered.mjs

      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Sentry (error monitoring pilot): DSN inlined into the bundle; auth token
          # (+ org/project) enables source-map upload for readable prod stack traces.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # PUBLIC Cloudflare Turnstile site key. Without this line the bundle ships with NO
          # captcha widget at all — see the assertion below, which is what makes that impossible
          # to miss.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Assert the Turnstile site key actually landed in the bundle (blocking)
        # A CAPTCHA THE CLIENT CANNOT ANSWER IS A WORSE OUTAGE THAN THE HOLE IT CLOSES.
        # `vite build` inlines VITE_* at BUILD time, and src/components/TurnstileWidget.tsx
        # deliberately renders NOTHING when VITE_TURNSTILE_SITE_KEY is unset. So an empty, missing
        # or wrong secret produces a widget-less bundle that looks completely healthy: every
        # runtime monitor stays green, and it becomes a TOTAL customer lockout — login, signup and
        # password reset all refused — the instant security_captcha_enabled is switched on
        # project-wide. ReplyFlow hit exactly this shape ("dead sitekey, green monitors").
        # `gh secret list` proves only that a NAME exists; this step is what proves the VALUE.
        # The site key is PUBLIC (it ships in every visitor's browser), so it is pinned literally
        # here and compared — a secret that is merely non-empty is not good enough.
        run: |
          set -euo pipefail
          expected='0x4AAAAAAEz4tSh-Lly_5idd'
          if ! grep -rq "$expected" ./dist/; then
            echo "::error::The Turnstile site key ($expected) is NOT in the production bundle."
            echo "  vite build inlines VITE_* at build time; the repository secret"
            echo "  VITE_TURNSTILE_SITE_KEY is empty, wrong, or was not passed to the build step."
            echo "  Shipping this renders no captcha widget at all, and enabling captcha"
            echo "  server-side afterwards would lock every real customer out of login, signup"
            echo "  and password reset. Nothing was deployed."
            exit 1
          fi
          echo "ok - Turnstile site key is present in the production bundle ($(grep -rl "$expected" ./dist/ | wc -l) file(s))."

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "valrano" > dist/.site-id

      - name: Verify deploy target (site-id guard)
        run: |
          # set +e: without it, bash -e aborts OUT=$(lftp…) on any non-zero exit BEFORE the
          # RC handling below runs — defeating the "connection-error vs first-deploy" logic
          # (a transient guard blip would abort blindly instead of retrying/allowing). §3f.
          set +e
          GUARD="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes;"
          OUT=$(timeout 90 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "$GUARD cat httpdocs/.site-id; quit" 2>&1)
          RC=$?
          REMOTE_ID=$(echo "$OUT" | tr -d '[:space:]')
          if [ $RC -ne 0 ]; then
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            if echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)|timed? ?out|connection refused|couldn.t connect'; then
              echo "::error::Site-id guard INCONCLUSIVE — FTP connection/auth failure, refusing to deploy blind. Output: $OUT"
              exit 1
            fi
            # Non-zero rc but not a connection/auth error — treat as file genuinely absent (first deploy). Allow through.
            REMOTE_ID=""
          fi
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "valrano" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'valrano'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload new hashed assets
        run: |
          set +e
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set net:timeout 60; set net:max-retries 8; set net:persist-retries 8; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1.2; set ftp:fix-pasv-address yes; set ftp:prefer-epsv no; set ftp:passive-mode yes; set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ httpdocs/assets/
          bye
          SCRIPT
          )
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 - not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::Upload new hashed assets failed after 4 attempts"; exit 1; }
            echo "::warning::Upload new hashed assets attempt $n failed - retrying in 25s..."
            sleep 25
          done
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload root files
        run: |
          set +e
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set net:timeout 60; set net:max-retries 8; set net:persist-retries 8; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1.2; set ftp:fix-pasv-address yes; set ftp:prefer-epsv no; set ftp:passive-mode yes; set mirror:parallel-transfer-count 4
          put ./dist/index.html -o httpdocs/index.html
          put ./dist/theme-init.js -o httpdocs/theme-init.js
          put ./dist/.htaccess -o httpdocs/.htaccess
          put ./dist/robots.txt -o httpdocs/robots.txt
          put ./dist/sitemap.xml -o httpdocs/sitemap.xml
          put ./dist/og-image.svg -o httpdocs/og-image.svg
          put ./dist/og-image.png -o httpdocs/og-image.png
          put ./dist/apple-touch-icon.png -o httpdocs/apple-touch-icon.png
          put ./dist/favicon.svg -o httpdocs/favicon.svg
          put ./dist/.site-id -o httpdocs/.site-id
          mkdir -p httpdocs/.well-known
          put ./dist/.well-known/security.txt -o httpdocs/.well-known/security.txt
          bye
          SCRIPT
          )
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 - not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::Upload root files failed after 4 attempts"; exit 1; }
            echo "::warning::Upload root files attempt $n failed - retrying in 25s..."
            sleep 25
          done
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Prune stale assets (14-day retention)
        # Replaces the old `mirror --delete` on assets/, which deleted every superseded
        # hashed chunk the moment a deploy landed — so any tab still running the previous
        # index.html got "Failed to fetch dynamically imported module" on its next lazy
        # navigation (Sentry valrano 2026-08-29 on staging, same pattern here). Old chunks
        # are now kept for 14 days — long after every open tab has reloaded — and pruned
        # by age afterwards. Same step shape as the staging job; see there for the full
        # rationale (lftp has no find -mtime; MDTM probing; never fails the deploy).
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: httpdocs/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths recursively (nested chunk dirs included);
            # normalize to a path relative to ASSETS_DIR so either format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0

      - name: Install Supabase CLI
        run: npm install -g supabase@2.109.1

      # Ship the database before anything else (2026-08-21, fleet drift fix).
      - name: Apply database migrations to production
        run: node scripts/apply-migrations.mjs --project-ref mkdeftmubrkseyrrbzvp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions to production
        run: |
          n=0
          until [ $n -ge 4 ]; do
            if supabase functions deploy --project-ref mkdeftmubrkseyrrbzvp --no-verify-jwt --use-api; then
              echo "Edge functions deployed to production (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Supabase functions-deploy attempt $n failed (transient API error, e.g. 502); backing off 60s..."; sleep 60
          done
          echo "::error::Edge functions deploy to production failed after 4 attempts"; exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}

      - name: Post-deploy production smoke test
        run: |
          # Confirm prod actually serves after the promotion (catches a broken build
          # that FTP'd cleanly but renders a 5xx). Retry to ride out CDN warm-up.
          for i in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://valrano.com || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Production smoke passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::prod smoke attempt $i got HTTP $STATUS — retrying in 15s"; sleep 15
          done
          echo "::error::Production smoke FAILED — valrano.com not serving 200"; exit 1
