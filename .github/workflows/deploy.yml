name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload new hashed assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ benchmarksignal.predivo.ch/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload root files
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          put ./dist/index.html -o benchmarksignal.predivo.ch/index.html
          put ./dist/.htaccess -o benchmarksignal.predivo.ch/.htaccess
          put ./dist/robots.txt -o benchmarksignal.predivo.ch/robots.txt
          put ./dist/sitemap.xml -o benchmarksignal.predivo.ch/sitemap.xml
          put ./dist/og-image.svg -o benchmarksignal.predivo.ch/og-image.svg
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Clean up stale assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms --delete \
            ./dist/assets/ benchmarksignal.predivo.ch/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
