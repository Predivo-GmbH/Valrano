name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Deploy edge functions to staging
        run: supabase functions deploy --project-ref vfwpcgdkrwqhdivfzmrg --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Smoke-test staging
        run: |
          echo "=== Staging GraphQL ping ==="
          gql_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_STAGING_URL }}/graphql/v1" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}')
          echo "GraphQL response: $gql_response"
          if [ "$gql_response" != "200" ]; then
            echo "::error::Staging smoke test FAILED (GraphQL returned $gql_response)"
            exit 1
          fi
          echo "Staging DB is alive"

      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - name: Integration tests against staging
        run: npm run test:integration
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}

  deploy:
    needs: validate-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs
        continue-on-error: true

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "valrano" > dist/.site-id

      - name: Verify deploy target (site-id guard)
        run: |
          REMOTE_ID=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "cat httpdocs/.site-id; quit" 2>/dev/null || echo "")
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "valrano" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'valrano'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload new hashed assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ httpdocs/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload root files
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          put ./dist/index.html -o httpdocs/index.html
          put ./dist/.htaccess -o httpdocs/.htaccess
          put ./dist/robots.txt -o httpdocs/robots.txt
          put ./dist/sitemap.xml -o httpdocs/sitemap.xml
          put ./dist/og-image.svg -o httpdocs/og-image.svg
          put ./dist/og-image.png -o httpdocs/og-image.png
          put ./dist/apple-touch-icon.png -o httpdocs/apple-touch-icon.png
          put ./dist/favicon.svg -o httpdocs/favicon.svg
          put ./dist/.site-id -o httpdocs/.site-id
          mkdir -p httpdocs/.well-known
          put ./dist/.well-known/security.txt -o httpdocs/.well-known/security.txt
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Clean up stale assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          mirror --reverse --verbose --no-perms --delete \
            ./dist/assets/ httpdocs/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Deploy edge functions to production
        run: supabase functions deploy --project-ref mkdeftmubrkseyrrbzvp --no-verify-jwt
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}

  deploy-staging:
    needs: validate-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "valrano-staging" > dist/.site-id

      - name: Prepare staging .htaccess
        run: |
          # Use the REAL production .htaccess (from build) so staging catches Apache errors
          mv dist/.htaccess /tmp/prod.htaccess
          {
            echo 'AuthType Basic'
            echo 'AuthName "Staging"'
            echo 'AuthUserFile /var/www/vhosts/valrano.com/staging.valrano.com/.htpasswd'
            echo 'Require valid-user'
            echo ''
            cat /tmp/prod.htaccess
            echo ''
            echo '# --- Staging overrides ---'
            echo '<IfModule mod_headers.c>'
            echo '  Header always set X-Robots-Tag "noindex, nofollow"'
            echo '  <FilesMatch "\.(js|css|woff2|png|jpg|webp|avif|svg|ico)$">'
            echo '    Header set Cache-Control "no-cache"'
            echo '  </FilesMatch>'
            echo '  <FilesMatch "\.html$">'
            echo '    Header set Cache-Control "no-cache, no-store, must-revalidate"'
            echo '  </FilesMatch>'
            echo '</IfModule>'
          } > dist/.htaccess

      - name: Verify deploy target (site-id guard)
        run: |
          REMOTE_ID=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "cat staging.valrano.com/.site-id; quit" 2>/dev/null || echo "")
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "valrano-staging" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'valrano-staging'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Upload to staging
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          mirror --reverse --verbose --no-perms --delete \
            --exclude .htpasswd --exclude cgi-bin/ \
            ./dist/ staging.valrano.com/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

  e2e-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "staging:predivo2026" https://staging.valrano.com --max-time 10)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging returned HTTP $STATUS — likely .htaccess syntax error. Blocking production deploy."
            exit 1
          fi
          echo "Staging health check passed (HTTP $STATUS)"

      - name: Run E2E tests against staging
        run: npm run test:e2e:staging
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: predivo2026
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: IntegrationTest2026!

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: playwright-report/
          retention-days: 7
