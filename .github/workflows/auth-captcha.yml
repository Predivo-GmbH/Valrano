name: Auth CAPTCHA switch

# THE SETTING THAT IS THE FIX. Closing the unauthenticated sign-in-email hole has two halves and
# only one is code. Half 2 is not a deploy — it is one project-wide GoTrue setting
# (security_captcha_enabled + provider + secret). Nothing in this repo could reach it, so on
# ReplyFlow that half sat undone behind a green deploy for four days while the row read "shipped".
# This workflow is how Valrano's gets flipped, read back and rolled back, by anyone, on the
# record, with the management token only CI holds, and without a secret ever being rendered.
#
# ORDER: the client half must be LIVE on the target project first — every auth form actually
# sending a cf-turnstile-response — or enabling this locks every customer out of login, signup and
# password reset. The deploy workflow now asserts the PUBLIC site key is inlined in the shipped
# bundle, which is the machine-checkable half of that precondition; the deployed CSP must also
# allow challenges.cloudflare.com in script-src AND frame-src, or the widget is blocked while the
# bundle assertion still passes.
# ROLLBACK: run it again with mode=disable. Instant and total.

on:
  # A DAILY READ, BECAUSE THE ONLY OTHER WITNESS WAS THE THING IT BLOCKED.
  # Measured on ReplyFlow 2026-09-11: production's switch was flipped ON and the fleet deploy page
  # went on showing red for TWELVE HOURS against a pre-flip gate run. The cause is a deadlock — the
  # guard ran in exactly two places, inside a production promotion and by hand, so the only run that
  # could record the switch as green was a promotion, and the promotion was being refused by that
  # same gate's stale red. A scheduled read breaks the loop, and it also catches the opposite case
  # (somebody turning captcha OFF) within a day instead of at the next promotion — which is the
  # case that actually costs customers.
  #
  # report mode is READ-ONLY: it prints booleans, names and value shapes, never a secret.
  schedule:
    # 05:30 UTC - off the hour and clear of the fleet's other jobs (ReplyFlow 05:40, LaunchReady 05:50).
    - cron: '30 5 * * *'

  workflow_dispatch:
    inputs:
      project:
        description: Which Supabase project
        required: true
        default: production
        type: choice
        options: [production, staging]
      mode:
        description: report (read-only) | enable | disable (rollback)
        required: true
        default: report
        type: choice
        options: [report, enable, disable]

# One writer at a time on a project's auth config: two of these racing would leave the switch in a
# state neither run reported.
concurrency:
  group: auth-captcha-${{ inputs.project || 'production' }}
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ${{ inputs.mode || 'report' }} CAPTCHA on ${{ inputs.project || 'production' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}
          # The Cloudflare Turnstile SECRET key for the Valrano sign-in widget (site key
          # 0x4AAAAAAEz4tSh-Lly_5idd, minted 2026-09-14). It cannot be read back out of the Supabase project:
          # edge-function secrets are stored write-only and GET /v1/projects/{ref}/secrets returns a
          # SHA-256 digest, not the value. This repository secret is the one usable source.
          # `enable` asks Cloudflare to confirm it is genuine before touching Supabase, so a
          # wrong-but-plausible value cannot become a silent, total customer lockout.
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: node scripts/auth-captcha.mjs ${{ inputs.mode || 'report' }} --project ${{ inputs.project || 'production' }}

      # A FLIP THAT IS NOT PROBED IS A CLAIM. This is the same guard the repo carries: it POSTs a
      # tokenless /recover at the live project and asserts it is refused FOR CAPTCHA REASONS.
      # /recover — NOT /otp — is the sharp endpoint: it is the one that actually mails a stranger a
      # link, and /otp's 422 otp_disabled is GoTrue's USER-LOOKUP answer, reached only after the
      # captcha middleware already let the request through. 400 + captcha is the only closed signal.
      - name: Prove it against the live project
        # Also on the schedule: a daily read that never probes would report the SETTING and not the
        # BEHAVIOUR, and it is the behaviour that went stale for twelve hours on ReplyFlow.
        #
        # THIS STEP IS RED UNTIL HALF 2 IS FLIPPED, AND THAT IS CORRECT — the hole really is open
        # until then. It goes green the moment, and only the moment, captcha is actually enforced.
        if: inputs.mode == 'enable' || github.event_name == 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The guard's PUBLIC publishable keys. production is normally read straight out of the
          # live bundle; these are the fallbacks so a run can never SKIP quietly and read as a pass.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
        run: node supabase/functions/_shared/signin-captcha.prod.test.mjs
