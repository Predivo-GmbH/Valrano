name: Secret Scan (gitleaks)

# Blocks secrets from entering the repo. On PRs it scans the PR commits; on
# pushes it scans the pushed commits. Free for user-owned repos (no license).
# Anon/publishable Supabase keys are public by design (RLS-protected) — if a
# scan flags one, add it to .gitleaksignore with a comment, don't hide a real secret.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action's ScanPullRequest lists the PR's commits via
  # GET /repos/{owner}/{repo}/pulls/{n}/commits, which requires pull-requests read.
  # Without it, pull_request runs 403 ("Resource not accessible by integration");
  # GitHub returns x-accepted-github-permissions: pull_requests=read.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        # TMPDIR is the runner's OWN temp folder, never the machine's /tmp: the action downloads to
        # os.tmpdir()/gitleaks.tmp and refuses if that file already exists, and on the laptop runners
        # (predivo-wsl) several runners share one /tmp. The SARIF upload roots itself at $HOME, which is
        # not where the checkout lives on those runners, so it threw AFTER "no leaks found". Nothing reads
        # that artifact. Same change as production-monitor #26 and cockpit #75 (2026-09-12 / 09-14).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # The action above scans the COMMIT RANGE of the event, and that is not enough.
      # Proven 2026-08-20 on ReplyFlow: a merge commit introduced a service_role JWT and
      # this workflow reported "No leaks detected". A working-tree scan sees the file as
      # it now stands regardless of how it got there (same form deploy.yml uses).
      # --config is passed ONLY when the repo actually has a .gitleaks.toml: gitleaks
      # exits non-zero on a config path that does not exist, which would fail the step
      # for the wrong reason and look exactly like a leak.
      # THE INVOCATION IS UNQUALIFIED ON PURPOSE (2026-09-14). The binary goes on PATH and is
      # called as `gitleaks dir .`. That exact text is the fleet's one detectable shape for "this
      # repo scans its working tree" — production-monitor scripts/lib/gitleaks-gate-scope.mjs,
      # hasWorkingTreeScan(), /gitleaks\s+dir\s+\./. When this step moved off /tmp onto $RUNNER_TEMP
      # the call became `"$RUNNER_TEMP/gitleaks" dir .`; the closing quote broke that match, and the
      # live fleet gate reported FOUR repos as having no working-tree scan while all four were
      # running one — a false red on every production-monitor PR (run 34814766454). The scan never
      # stopped; only the proof that it existed did. Receipt that it was running all along:
      # BoatBuddy run 34810626846, step "gitleaks (working tree)" scanned 2.79 MB, no leaks found.
      #
      # chmod targets $RUNNER_TEMP too. It used to chmod /tmp/gitleaks — a file this step no longer
      # creates. It only kept passing because a stale /tmp/gitleaks is left lying around on the
      # shared WSL runners; on a clean runner chmod would fail and redden the step for no reason.
      - name: gitleaks (working tree)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          export PATH="$RUNNER_TEMP:$PATH"
          CFG=""
          if [ -f .gitleaks.toml ]; then CFG="--config .gitleaks.toml"; fi
          gitleaks dir . --no-banner --redact --exit-code 1 $CFG
