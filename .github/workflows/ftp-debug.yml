name: FTP Debug
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: FTP connectivity diagnostic
        run: |
          set +e
          echo "=== runner egress IP ==="
          curl -s --max-time 10 https://api.ipify.org; echo
          echo "=== curl FTPS matching lftp settings (-k, control-only SSL, PASV) ==="
          curl -v -k --ftp-ssl-control --ftp-pasv --disable-epsv --max-time 45 \
            -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1 \
            | grep -iE "Trying|Connected|SSL connection|220|USER|331|PASS|230|530|Login|PASV|EPSV|227|229|Access|denied|MLSD|LIST|150|226|timed out|refused|closing|abort|data" \
            | head -30
          echo "=== curl exit: $? ==="
          echo "=== lftp with debug (exact deploy settings, 1 try, 20s timeout) ==="
          sudo apt-get install -y -qq lftp >/dev/null 2>&1
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<'EOF' 2>&1 | grep -iE "Connecting|220|USER|331|230|530|PASV|EPSV|227|229|Making data|SSL|150|226|Access|error|timeout|not connected|closing|fatal" | head -30
          set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set net:timeout 20; set net:max-retries 1; set ftp:prefer-epsv no; set ftp:fix-pasv-address yes
          debug 3
          cls httpdocs/
          bye
          EOF
          echo "=== done ==="
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
