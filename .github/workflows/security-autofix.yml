name: Security autofix

# WHY THIS EXISTS (Roger, 2026-10-26). This product is PARKED: nobody is working on it, but its
# dependency flaws still have to be fixed - by GitHub, not by a Claude session. The weekly fleet
# dependency audit (production-monitor, Mondays 07:10 UTC) kept putting parked products back on the
# board. Not because a fix failed: the 15.10 fixes held, and every one of the 9 advisories found on
# 26.10 was added to npm's list between 20.10 and 23.10, against packages already in use. That will
# keep happening, and until now every round cost a session.
#
# WHY NOT DEPENDABOT. Dependabot's pull requests run without this repository's Actions secrets, and
# the tests here need them (Supabase keys for the e2e build; the repos that use the private
# @predivo-gmbh/gate-kit package need a registry token just to `npm ci`). There is no branch
# protection, so GitHub's own auto-merge cannot be switched on either. This job runs in the
# repository's own context instead, with the same secrets the normal test run has.
#
# WHAT IT DOES, once a day:
#   1. `npm audit fix` on Linux with node 22 / npm 10 - the npm CI uses, so the lockfile it writes is
#      one `npm ci` accepts (a lockfile written with the laptop's npm 11 broke CI on 2026-10-15).
#      No --force: only fixes inside the version ranges package.json already allows.
#   2. If that changed anything, it runs THIS repository's own test.yml on the fixed commit.
#   3. Only if those tests pass, it fast-forwards the default branch to exactly that commit.
# Nothing here deploys: a push made with GITHUB_TOKEN starts no other workflow, so staging and
# production stay where they are (a parked product gets no deploys, Roger 2026-09-14).
# What it cannot fix (no fixed version yet, or only a breaking upgrade) stays visible: the Monday
# audit still raises a board row for it.

on:
  schedule:
    - cron: '20 5 * * *' # daily; lands before the Monday fleet audit at 07:10 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fix and test, but do not merge'
        type: boolean
        default: false

permissions:
  contents: read

# A literal name on purpose: test.yml groups on "<workflow>-<ref>", and a called workflow takes the
# caller's workflow name, so the same pattern here would make the two runs wait on each other.
concurrency:
  group: security-autofix
  cancel-in-progress: false

env:
  # .npmrc points @predivo-gmbh at GitHub Packages where a repo uses gate-kit; unused elsewhere.
  # Same fallback as test.yml: an empty secret is falsy, so GITHUB_TOKEN (packages: read) steps in.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  fix:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write # push the side branch
      packages: read # gate-kit, where used
      actions: write # keep this schedule switched on (first step)
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Keep this schedule switched on
        # GitHub switches a scheduled workflow off after 60 days without repository activity, and a
        # parked repository has none. Enabling it again on every run restarts that clock. Node's fetch,
        # not `gh`: the self-hosted runner has no gh (exit 127 on arivioo, 2026-10-26). A warning, not
        # a failure - a lapse here must never stop today's fix.
        run: |
          node -e '
            fetch(`https://api.github.com/repos/${process.env.REPO}/actions/workflows/security-autofix.yml/enable`, {
              method: "PUT", headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
            }).then((r) => console.log(r.ok ? "schedule kept on" : `::warning::could not keep the schedule on (HTTP ${r.status})`))
              .catch((e) => console.log(`::warning::could not keep the schedule on (${e.message})`))'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      # --ignore-scripts everywhere: this job holds a token that can push, and the new package versions
      # are exactly the code nobody has looked at yet. They first run in the test job, which can't push.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: npm audit fix (no --force)
        # npm 10 cannot do this step: its `audit fix` dies with "Cannot read properties of null (reading
        # 'edgesOut')", with or without node_modules (measured on this job, 2026-10-26). npm 11 computes
        # the fix; npm 10 - the npm `npm ci` in test.yml uses - then rewrites the lockfile so CI accepts it.
        # A CRASH IS NEVER "NOTHING TO FIX": the first version swallowed it with `|| true` and went green
        # having fixed nothing. Any `npm error` line fails the job, and so does a fixable high/critical
        # advisory that leaves the lockfile untouched.
        run: |
          fixable() { npm audit --json 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              const v = Object.values(JSON.parse(s || "{}").vulnerabilities || {})
              console.log(v.filter((x) => ["high", "critical"].includes(x.severity) && x.fixAvailable &&
                (x.fixAvailable === true || !x.fixAvailable.isSemVerMajor)).length) })'; }
          before=$(fixable)
          echo "high/critical with a non-breaking fix, before: $before"
          set +e
          npx -y npm@11 audit fix --ignore-scripts --no-fund > fix.log 2>&1
          set -e
          cat fix.log
          if grep -q '^npm error' fix.log; then echo "::error::npm audit fix crashed - that is not 'nothing to fix'"; exit 1; fi
          rm -f fix.log
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ "$before" -gt 0 ] && git diff --quiet -- package.json package-lock.json; then
            echo "::error::$before fixable high/critical advisories, yet the lockfile did not move"; exit 1
          fi

      - name: Commit the fix to a side branch
        id: commit
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm audit fix changed nothing: nothing here is fixable without a breaking upgrade."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b security-autofix
          git add package.json package-lock.json
          left=$(npm audit --json 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              const m = (JSON.parse(s || "{}").metadata || {}).vulnerabilities || {}
              console.log(`critical ${m.critical ?? "?"}, high ${m.high ?? "?"}, moderate ${m.moderate ?? "?"}`) })')
          git commit -m "Security autofix: npm audit fix (no --force)" \
            -m "Daily job .github/workflows/security-autofix.yml. Merged only after test.yml passed on this commit. Left in the full tree afterwards: ${left}"
          git push --force origin security-autofix
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: fix
    if: needs.fix.outputs.sha != ''
    # The repository's real test suite, not a copy of it, on the exact commit that would be merged.
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.fix.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
      actions: read

  merge:
    needs: [fix, test]
    if: needs.fix.outputs.sha != '' && !inputs.dry_run
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fast-forward the default branch to the tested commit
        # --ff-only: if anything landed on the default branch while the tests ran, this refuses
        # rather than merging an untested combination; tomorrow's run starts from the new head.
        run: |
          git fetch origin security-autofix
          git merge --ff-only "${{ needs.fix.outputs.sha }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git push origin --delete security-autofix
