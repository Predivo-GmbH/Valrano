name: v11 Staging Gates

# Runs the v11 hardened audit gates (e2e/staging/v11-gates.spec.ts) against the LIVE
# staging site (staging.valrano.com):
#   Gate A   constrained-viewport reachability (off-screen critical-control class)
#   Gate B/J create-event commit-boundary + zero-residue
#   Gate I   correctness under real data volume (>1000-row PostgREST cap)
#   Gate K   fault-injected 500/empty loads render gracefully
#   Gate M   deployed-bundle identity - staging bundle talks to STAGING, never prod
# A red run here IS the alert (same model as the fleet grant-drift/auth-email guards).
# DELIBERATELY separate from the prod-promotion gauntlet (needs the Management token).

on:
  workflow_run:
    workflows: ['Deploy to Production'] # re-verify staging right after every deploy
    types: [completed]
  schedule:
    # DAILY 06:30 UTC (was weekly Mon). 2026-08-24: the Gate A runtime crawl moved off the
    # per-deploy path to this schedule. Measured over 320 completed gate runs fleet-wide the
    # crawl is 71.4 percent of gate wall time. It DISCOVERS dialog surfaces by driving the
    # app and asserts nothing about the commit that triggered it, so per-push was the wrong
    # cadence for it. The assertions still run on every deploy.
    - cron: '30 6 * * *'
  workflow_dispatch: {}

concurrency:
  # Separate group per run kind (2026-08-24, commit 6250b68 fallout): the per-deploy `gates`
  # run and the daily/manual `full` run must NOT share a group. With one shared group a queued
  # deploy `gates` run would supersede a PENDING daily `full` run and silently cancel the only
  # Gate A crawl + coverage denominator of that day (it shows grey `cancelled`, not red, so
  # nothing reports it). Now deploy runs serialise only against deploy runs, full against full.
  group: v11-staging-gates-${{ github.event_name == 'workflow_run' && 'deploy' || 'full' }}
  # NOT cancel-in-progress. This gate takes ~35 minutes and each group key is a constant, so a
  # newer run of the SAME kind killed the one in flight, often at minute 34. Measured 2026-08-24
  # across the seven repos that run it: 40 of 133 recent runs ended `cancelled`, 30 percent, and
  # BackOffice had 1 success and 0 failures against 12 cancellations. A cancelled gate is
  # not a failing gate, so the dashboard looked clean while the gate was barely reporting.
  # With false, the running gate finishes; GitHub keeps at most one run pending, so a newer run
  # of the same kind still supersedes an older WAITING one without destroying a verdict in progress.
  cancel-in-progress: false

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------------------
  # PER-DEPLOY: the assertions only. No seed, no crawl.
  # The Gate A COVERAGE DENOMINATOR is excluded here and ONLY here, because it reads
  # playwright/.gate-a/crawl-manifest.json which only the crawl writes. It is not weakened:
  # it runs in the `full` job below, in the SAME job as the crawl that feeds it, and it still
  # FAILS on a missing manifest (v11-gates.spec.ts asserts existsSync(...) is true). Leaving
  # it here to read the previous run's manifest is the defect, not the fix.
  # ---------------------------------------------------------------------------------------
  gates:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Gate A runtime crawl (2026-08-20, converted to the shared gate-kit engine
      # 2026-08-21). The hand-written Gate A list is the defect the B4 meta-audit
      # found: Valrano drove 1 of 7 dialog-class surfaces while its report published
      # "Gate A: PASS". This discovers dialogs by DRIVING the app at BOTH a desktop and a
      # mobile width, as TWO identities (authenticated + anonymous - the landing page and
      # its two modals render only for the anonymous one), so nothing has to be remembered.
      # Its first run found the mobile navigation drawer with "Sign out" sliced by the
      # screen edge in phone landscape.
      # READ-ONLY: commit controls are measured, never clicked. The denylist comes from a
      # no-click reconnaissance pass, and it also blocks the AI-assistant question chips,
      # which would each bill a paid Anthropic call on every scheduled run.
      # RUNS FIRST: the v11 coverage-denominator test reads the crawl manifest this step
      # writes (playwright/.gate-a/crawl-manifest.json). While the crawl ran AFTER v11
      # here, the coverage number came from the PREVIOUS run. Same fix as replyflow.
      # !cancelled(): a known-red earlier gate must not silently disable this layer (failure
      # is not cancellation, so this step still runs when a prior gate went red). NOT
      # always(): always() is ALSO true on CANCELLATION, and this workflow sets
      # cancel-in-progress: true on a workflow_run trigger that fires after every Deploy -
      # so under always() a superseded run would keep crawling live staging.valrano.com
      # alongside the run that replaced it. Same fix as BackOffice 73d96a0.
      - name: Run v11 hardened gates against staging (coverage denominator runs in `full`)
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.v11-gates.config.ts --grep-invert "coverage denominator"
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          # Reuse the existing staging Supabase access token (Management API) - no new secret.
          VAL_MGMT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: v11-gates-report
          path: |
            playwright-report/
            !playwright-report/data/**
          retention-days: 7

  # ---------------------------------------------------------------------------------------
  # DAILY + MANUAL: seed -> crawl -> the FULL suite including the coverage denominator.
  # Byte-identical to what used to run after every deploy; only its cadence changed.
  # ---------------------------------------------------------------------------------------
  full:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 75
    if: ${{ github.event_name != 'workflow_run' }}
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Gate A runtime crawl (2026-08-20, converted to the shared gate-kit engine
      # 2026-08-21). The hand-written Gate A list is the defect the B4 meta-audit
      # found: Valrano drove 1 of 7 dialog-class surfaces while its report published
      # "Gate A: PASS". This discovers dialogs by DRIVING the app at BOTH a desktop and a
      # mobile width, as TWO identities (authenticated + anonymous - the landing page and
      # its two modals render only for the anonymous one), so nothing has to be remembered.
      # Its first run found the mobile navigation drawer with "Sign out" sliced by the
      # screen edge in phone landscape.
      # READ-ONLY: commit controls are measured, never clicked. The denylist comes from a
      # no-click reconnaissance pass, and it also blocks the AI-assistant question chips,
      # which would each bill a paid Anthropic call on every scheduled run.
      # RUNS FIRST: the v11 coverage-denominator test reads the crawl manifest this step
      # writes (playwright/.gate-a/crawl-manifest.json). While the crawl ran AFTER v11
      # here, the coverage number came from the PREVIOUS run. Same fix as replyflow.
      # !cancelled(): a known-red earlier gate must not silently disable this layer (failure
      # is not cancellation, so this step still runs when a prior gate went red). NOT
      # always(): always() is ALSO true on CANCELLATION, and this workflow sets
      # cancel-in-progress: true on a workflow_run trigger that fires after every Deploy -
      # so under always() a superseded run would keep crawling live staging.valrano.com
      # alongside the run that replaced it. Same fix as BackOffice 73d96a0.
      - name: Run Gate A runtime crawl against staging
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.gate-a-crawl.config.ts
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      # (No separate curl alive-check: the gates' auth.setup navigates to staging and
      # fails fast if it's down/500, so a dead staging already turns this workflow red - # and it avoids embedding a `curl -u user:pass` pattern that trips secret scanners.)
      # !cancelled(): the crawl step above can be red (e.g. a route blocked behind an
      # undismissable modal) and the v11 gates must STILL run - the coverage denominator
      # reads the manifest the crawl writes before its assertions fire.
      - name: Run v11 hardened gates against staging
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.v11-gates.config.ts
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          # Reuse the existing staging Supabase access token (Management API) - no new secret.
          VAL_MGMT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: v11-gates-report
          path: |
            playwright-report/
            !playwright-report/data/**
          retention-days: 7
