name: v11 Staging Gates

# Runs the v11 hardened audit gates (e2e/staging/v11-gates.spec.ts) against the LIVE
# staging site (staging.valrano.com):
#   Gate A   constrained-viewport reachability (off-screen critical-control class)
#   Gate B/J create-event commit-boundary + zero-residue
#   Gate I   correctness under real data volume (>1000-row PostgREST cap)
#   Gate K   fault-injected 500/empty loads render gracefully
#   Gate M   deployed-bundle identity - staging bundle talks to STAGING, never prod
# A red run here IS the alert (same model as the fleet grant-drift/auth-email guards).
# DELIBERATELY separate from the prod-promotion gauntlet (needs the Management token).

on:
  workflow_run:
    workflows: ['Deploy to Production'] # re-verify staging right after every deploy
    types: [completed]
  schedule:
    - cron: '30 6 * * 1' # weekly Mon 06:30 UTC (after the fleet monitors)
  workflow_dispatch: {}

concurrency:
  group: v11-staging-gates
  # NOT cancel-in-progress. This gate takes ~35 minutes and the group is a constant, so any
  # newer run killed the one in flight, often at minute 34. Measured 2026-08-24 across the
  # seven repos that run it: 40 of 133 recent runs ended `cancelled`, 30 percent, and
  # BackOffice had 1 success and 0 failures against 12 cancellations. A cancelled gate is
  # not a failing gate, so the dashboard looked clean while the gate was barely reporting.
  # With false, the running gate finishes; GitHub keeps at most one run pending, so a newer
  # commit still supersedes an older WAITING one without destroying a verdict in progress.
  cancel-in-progress: false

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # v11 gates + the Gate A runtime crawl (2 identities x 8 routes x 2 widths, measured 26.8 min locally 2026-08-21)
    # Skip when a Deploy run FAILED (nothing new to verify); always run on schedule/manual.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Gate A runtime crawl (2026-08-20, converted to the shared gate-kit engine
      # 2026-08-21). The hand-written Gate A list is the defect the B4 meta-audit
      # found: Valrano drove 1 of 7 dialog-class surfaces while its report published
      # "Gate A: PASS". This discovers dialogs by DRIVING the app at BOTH a desktop and a
      # mobile width, as TWO identities (authenticated + anonymous - the landing page and
      # its two modals render only for the anonymous one), so nothing has to be remembered.
      # Its first run found the mobile navigation drawer with "Sign out" sliced by the
      # screen edge in phone landscape.
      # READ-ONLY: commit controls are measured, never clicked. The denylist comes from a
      # no-click reconnaissance pass, and it also blocks the AI-assistant question chips,
      # which would each bill a paid Anthropic call on every scheduled run.
      # RUNS FIRST: the v11 coverage-denominator test reads the crawl manifest this step
      # writes (playwright/.gate-a/crawl-manifest.json). While the crawl ran AFTER v11
      # here, the coverage number came from the PREVIOUS run. Same fix as replyflow.
      # !cancelled(): a known-red earlier gate must not silently disable this layer (failure
      # is not cancellation, so this step still runs when a prior gate went red). NOT
      # always(): always() is ALSO true on CANCELLATION, and this workflow sets
      # cancel-in-progress: true on a workflow_run trigger that fires after every Deploy -
      # so under always() a superseded run would keep crawling live staging.valrano.com
      # alongside the run that replaced it. Same fix as BackOffice 73d96a0.
      - name: Run Gate A runtime crawl against staging
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.gate-a-crawl.config.ts
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      # (No separate curl alive-check: the gates' auth.setup navigates to staging and
      # fails fast if it's down/500, so a dead staging already turns this workflow red - # and it avoids embedding a `curl -u user:pass` pattern that trips secret scanners.)
      # !cancelled(): the crawl step above can be red (e.g. a route blocked behind an
      # undismissable modal) and the v11 gates must STILL run - the coverage denominator
      # reads the manifest the crawl writes before its assertions fire.
      - name: Run v11 hardened gates against staging
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.v11-gates.config.ts
        env:
          STAGING_URL: https://staging.valrano.com
          STAGING_HTTP_USER: staging
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTTP_PASS }}
          STAGING_TEST_EMAIL: e2e-test@valrano-test.local
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          # Reuse the existing staging Supabase access token (Management API) - no new secret.
          VAL_MGMT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: v11-gates-report
          path: playwright-report/
          retention-days: 7
