    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="preconnect" href="https://mkdeftmubrkseyrrbzvp.supabase.co" />
    <link rel="dns-prefetch" href="https://mkdeftmubrkseyrrbzvp.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <!-- https://challenges.cloudflare.com in BOTH script-src and frame-src is what lets
         the Cloudflare Turnstile widget load at all: Turnstile pulls turnstile/v0/api.js
         (script-src) and then renders the challenge inside an IFRAME (frame-src). Miss either
         one and the widget is silently blocked while the deploy's bundle assertion still
         PASSES — the site key is in the JS, every monitor green, and every customer locked out
         the moment captcha is enforced server-side. This meta CSP and public/.htaccess are
         BOTH enforced (the browser applies each policy separately), so both had to change. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://api.anthropic.com https://www.wikidata.org https://api.stripe.com https://*.ingest.de.sentry.io https://*.sentry.io https://challenges.cloudflare.com; frame-src 'self' https://js.stripe.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options cannot be set via <meta> (browsers reject it with a console
         error) — it is sent as a real header from .htaccess, plus CSP frame-ancestors -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <title>Valrano — AI-Powered Competitive Benchmarking</title>
    <!-- CSP-safe theme bootstrap (external file; inline scripts are blocked by script-src 'self') -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
